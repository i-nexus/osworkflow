
try {
    apply from: 'local.gradle'
} catch (e) {
    // You don't have to have a local.gradle file
}
apply plugin: 'java'
apply plugin: 'maven-publish'

group = 'com.i-nexus.opensymphony'
version = project.hasProperty('app_version') ? app_version : 'local'

description = "bare minimum OpenSymphony Workflow based on 3.0 code base"

sourceCompatibility = '17'
targetCompatibility = '17'

repositories {
    mavenCentral()
    maven {
        url rootProject.ext.releaseRepo
        allowInsecureProtocol=true
        metadataSources {
            gradleMetadata()
            mavenPom()
            artifact()
        }
    }
}
dependencies {

    implementation group: 'bsf', name: 'bsf', version: '2.4.0'
    implementation group: 'bsh', name: 'bsh', version: '1.3.0'

    // opensymphony
    implementation group: 'opensymphony', name: 'oscore', version: '2.2.4'
    implementation group: 'opensymphony', name: 'propertyset', version: '1.5'

    // spring
    implementation group: 'org.springframework', name: 'spring-context', version: '6.2.7'

    implementation group: 'org.hibernate', name: 'hibernate-core', version: '6.2.37.Final'
}

// custom tasks for creating source/javadoc jars
task sourcesJar(type: Jar, dependsOn: classes) {
    classifier = 'sources'
    from sourceSets.main.allSource
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    classifier = 'javadoc'
    from javadoc.destinationDir
}

// Ignore lint errors from Javadoc by not generating it.
tasks.withType(Javadoc).configureEach { enabled = false }

// add javadoc/source jar tasks as artifacts
artifacts {
    archives sourcesJar, javadocJar
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            version version
            artifactId rootProject.name
            groupId group

            pom.withXml {
                asNode().dependencies.'*'.findAll() {
                    it.scope.text() == 'runtime' && project.configurations.implementation.allDependencies.find { dep ->
                        dep.name == it.artifactId.text()
                    }
                }.each() {
                    it.scope*.value = 'compile'
                }
            }
            from components.java
            artifact sourcesJar {
                classifier "sources"
            }
            artifact javadocJar {
                classifier "javadoc"
            }
        }
    }
    repositories {
        maven {
            url rootProject.ext.releaseRepo
            allowInsecureProtocol=true
            credentials {
                username rootProject.ext.releaseRepoUserName
                password rootProject.ext.releaseRepoPassword
            }
        }
    }
}

javadoc {
    failOnError = false
}
